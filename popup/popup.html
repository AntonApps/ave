<label class="switch">
  <input type="checkbox" id="toggle3D">

</label>

    <button id="moreVis">
      Get More Visualizations
    </button>
    <button id="donate">
    💖 Support this project
    </button>

  </div>
  <div class="version">
  AntonApps - v1.0
</div>
